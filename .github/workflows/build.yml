name: Build Tearwash CLAP Plugin

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev xvfb

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Tests
      if: runner.os == 'Linux'
      run: |
        build/tearwash_dsp_test
        build/tearwash_preset_test
        build/tearwash_state_test
        xvfb-run -a build/tearwash_gui_test build/tearwash_snapshot.ppm

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tearwash-${{ runner.os }}
        path: |
          build/tearwash.clap
          build/Release/tearwash.clap
          build/tearwash_snapshot.ppm
        if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: release-raw
    - name: Package
      run: |
        mkdir dist
        for os in Linux Windows macOS; do
          (cd release-raw/tearwash-$os && zip -r ../../dist/Tearwash-$os-${{ github.ref_name }}.zip .)
        done
    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
